name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published advisories are caught even without code changes.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dawa
          POSTGRES_PASSWORD: dawa_ci_pw
          POSTGRES_DB: dawa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dawa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dawa:dawa_ci_pw@localhost:5432/dawa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on any known high or critical vulnerability in installed packages.
      - name: Dependency audit
        run: npm audit --audit-level=high
      # Fails if a password, key or token appears anywhere in the repository history.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --redact --no-banner
